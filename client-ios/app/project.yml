name: StasisClient
options:
  minimumXcodeGenVersion: "2.40.0"
  bundleIdPrefix: stasis.client.ios
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  schemePathPrefix: "../"

schemes:
  StasisClient:
    build:
      targets:
        StasisClient: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

packages:
  StasisClientLib:
    path: ../lib

settings:
  base:
    SWIFT_VERSION: "6.2"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  StasisClient:
    type: application
    platform: iOS
    sources:
      - path: StasisClient
        excludes:
          - "*.entitlements"
          - "PrivacyInfo.xcprivacy"
      - path: StasisShared
    scheme:
      testTargets:
        - StasisClientTests
    resources:
      - path: StasisClient/Assets.xcassets
      - path: StasisClient/PrivacyInfo.xcprivacy
    info:
      path: StasisClient/Info.plist
      properties:
        CFBundleDisplayName: stasis
        CFBundleShortVersionString: "0.0.0"
        CFBundleVersion: "1"
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryUsageDescription: "stasis backs up the photos and videos you choose so you can restore them later."
        NSPhotoLibraryAddUsageDescription: "stasis restores photos and videos back to your library."
        NSContactsUsageDescription: "stasis backs up your contacts so you can restore them later."
        NSCalendarsFullAccessUsageDescription: "stasis backs up your calendar events so you can restore them later."
        UIBackgroundModes:
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - stasis.client.ios.refresh
          - stasis.client.ios.processing
          - stasis.client.ios.continued.*
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: stasis.client.ios
        CODE_SIGN_ENTITLEMENTS: StasisClient/StasisClient.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: StasisClientLib
      - target: StasisShare

  StasisClientTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StasisClientTests
    dependencies:
      - target: StasisClient
      - package: StasisClientLib
      - package: StasisClientLib
        product: StasisClientLibTestSupport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: stasis.client.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/StasisClient.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/StasisClient
        BUNDLE_LOADER: $(TEST_HOST)

  StasisShare:
    type: app-extension
    platform: iOS
    sources:
      - path: StasisShare
        excludes:
          - "*.entitlements"
          - "PrivacyInfo.xcprivacy"
      - path: StasisShared
    resources:
      - path: StasisShare/PrivacyInfo.xcprivacy
    info:
      path: StasisShare/Info.plist
      properties:
        CFBundleDisplayName: stasis
        CFBundleShortVersionString: "0.0.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 10
              NSExtensionActivationSupportsImageWithMaxCount: 100
              NSExtensionActivationSupportsMovieWithMaxCount: 100
              NSExtensionActivationSupportsWebURLWithMaxCount: 5
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: stasis.client.ios.share
        CODE_SIGN_ENTITLEMENTS: StasisShare/StasisShare.entitlements
    dependencies:
      - package: StasisClientLib
